name: CI

on:
  push:
    branches:
      - main
      - feat/frontend-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test shared domain
        run: pnpm --filter @ask-better/domain test

      - name: Build Web
        run: pnpm --filter web build

  cleanup-feature-branch:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init cleanup
          cd cleanup
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push origin --delete feat/frontend-foundation || true
